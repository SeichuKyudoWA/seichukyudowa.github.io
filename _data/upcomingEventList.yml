- year: 2027
  months:
    - month: Summer
      events:
        - title: Fire Mountain Monthly All-Day Outdoor Shooting
          location: Mount Vernon, WA
          dates: Always on a Saturday, consult Discord for exact dates.
          cost: $35 for rental fees and drinks
          other_information:
            - text: Event lasts from 8am until 6pm.
            - text: Featuring a Kinteki (28m), Enteki (60m) taikai (tournament) shooting, and free shooting at both ranges.
